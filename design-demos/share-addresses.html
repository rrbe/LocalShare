<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalShare · 分享地址设计 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#efeae1; --surface:#fdfbf7; --surface-alt:#f5f0e7; --field:#efe9de;
      --ink:#2a261d; --muted:#8c8475; --faint:#b4ab99; --line:#e7dfd1;
      --strong:#dacfbd; --accent:#df4f28; --accent-soft:rgba(223,79,40,.12);
      --ok:#2f9e57; --danger:#c43c1c; --warn:#b67708;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
      --serif:"Songti SC","Source Serif 4",Georgia,serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    [data-theme="dark"] {
      color-scheme:dark;
      --bg:#1b1814; --surface:#262219; --surface-alt:#211e16; --field:#1d1a14;
      --ink:#f2eee5; --muted:#a59d8c; --faint:#6d675a; --line:#37322a;
      --strong:#494238; --accent-soft:rgba(223,79,40,.18); --danger:#ef8a6e;
      --warn:#e0a83a;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px var(--sans); }
    button,select,input { font:inherit; }
    button { cursor:pointer; color:inherit; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,select:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    button,select { -webkit-tap-highlight-color:transparent; }
    .icon { width:18px; height:18px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
    .workspace { display:flex; justify-content:center; align-items:flex-start; gap:64px; padding:40px 28px; min-height:100dvh; }
    .inspector { width:260px; flex-shrink:0; padding-top:38px; }
    .wordmark { font:600 27px var(--serif); letter-spacing:-.6px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:650; margin:12px 0 8px; }
    .intro { font-size:14px; color:var(--muted); line-height:1.8; margin:0 0 30px; }
    .control-block { padding:18px 0; border-top:1px solid var(--line); }
    .control-title { display:block; font-weight:600; font-size:12px; margin-bottom:10px; }
    .segmented { display:flex; gap:5px; padding:4px; border:1px solid var(--line); border-radius:11px; background:var(--surface-alt); }
    .segmented button { background:transparent; border:0; border-radius:7px; flex:1; padding:8px 3px; font-size:12px; color:var(--muted); }
    .segmented button.active { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(40,30,15,.08); font-weight:600; }
    .demo-field { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0; font-size:12px; color:var(--muted); }
    select { color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:7px 8px; }
    .note { color:var(--muted); font-size:12px; line-height:1.8; margin:10px 0 0; }
    .note strong { color:var(--ink); font-weight:600; }
    .reset { display:flex; align-items:center; gap:6px; margin-top:18px; padding:0; color:var(--accent); border:0; background:none; font-size:12px; }
    .window { width:460px; max-width:100%; height:min(920px,calc(100dvh - 80px)); min-height:570px; background:var(--bg); border:1px solid var(--strong); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(0,0,0,.10),0 18px 50px rgba(40,30,15,.16); }
    .chrome { height:33px; flex-shrink:0; display:flex; align-items:center; padding:0 16px; gap:7px; background:var(--surface-alt); }
    .traffic { width:10px; height:10px; border-radius:50%; background:#ff5f57; }
    .traffic:nth-child(2) { background:#febc2e; }
    .traffic:nth-child(3) { background:#28c840; }
    .chrome-label { flex:1; text-align:center; font-size:10px; color:var(--muted); padding-right:41px; }
    .app-header { display:flex; align-items:center; gap:12px; padding:12px 20px 14px; flex-shrink:0; }
    .app-header h1 { font:600 25px var(--serif); margin:0; flex:1; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
    .icon-button:hover { background:var(--surface-alt); border-color:var(--strong); }
    .app-scroll { overflow:auto; scrollbar-width:thin; padding:0 20px 20px; flex:1; }
    .ticket { border-radius:17px; background:var(--surface); overflow:hidden; box-shadow:0 8px 25px rgba(40,30,15,.07); }
    .file-meta { padding:18px 18px 16px; display:flex; gap:12px; align-items:center; }
    .folder-glyph { width:44px; height:44px; border-radius:12px; color:var(--accent); background:var(--accent-soft); display:grid; place-items:center; flex-shrink:0; }
    .folder-glyph .icon { width:24px; height:24px; }
    .file-name { font:600 20px var(--serif); margin-bottom:4px; }
    .file-detail { font:11px var(--mono); color:var(--muted); }
    .permissions { display:flex; gap:5px; margin-top:9px; }
    .chip { border:1px solid var(--line); border-radius:999px; font-size:10px; color:var(--muted); padding:2px 7px; }
    .tear { position:relative; border-top:1.5px dashed var(--strong); margin:0 16px; }
    .tear::before,.tear::after { content:""; position:absolute; width:18px; height:18px; border-radius:50%; top:-10px; background:var(--bg); }
    .tear::before { left:-25px; } .tear::after { right:-25px; }
    .access-mode { margin:14px 16px 0; }
    .access-mode-detail { height:40px; margin:8px 16px 0; display:grid; align-items:center; text-align:center; font:11.5px var(--sans); color:var(--muted); }
    #share-link-hint { font-size:14px; font-weight:500; color:var(--ink); }
    .access-code { height:40px; display:flex; align-items:center; justify-content:center; font:12px var(--mono); background:var(--accent-soft); border:1px solid var(--line); border-radius:11px; }
    .access-mode button.active { background:var(--accent); color:white; box-shadow:none; }
    .hostname-toggle { position:relative; width:calc(100% - 14px); height:16px; margin:2px 7px 4px; border:0; border-radius:5px; padding:0; color:var(--muted); display:flex; align-items:center; justify-content:center; background:none; overflow:hidden; }
    .hostname-preview { position:absolute; top:6px; left:9px; right:9px; height:16px; text-align:left; font-size:10px; color:var(--muted); filter:blur(4px); -webkit-mask-image:linear-gradient(#000,transparent); mask-image:linear-gradient(#000,transparent); pointer-events:none; }
    .hostname-toggle .icon { position:relative; width:12px; height:12px; }
    .hostname-toggle[aria-expanded="true"] .icon { transform:rotate(180deg); }
    .relay-title, .relay-divider { flex-shrink:0; }
    .relay-domain { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .relay-verified { flex-shrink:0; display:inline-flex; color:var(--ok); vertical-align:middle; margin-left:4px; }
    .relay-verified .icon { width:13px; height:13px; }
    .relay-warning { color:var(--warn); display:flex; align-items:flex-start; gap:5px; line-height:1.5; }
    .relay-warning .icon { width:13px; height:13px; margin-top:1px; }
    .group-foot .text-action { flex-shrink:0; }
    .qr-area { text-align:center; padding:20px 16px 18px; }
    .qr-box { width:152px; height:152px; display:grid; place-items:center; margin:auto; background:#fff; border-radius:13px; padding:12px; box-shadow:0 6px 20px rgba(40,30,15,.08); }
    .qr-box img { width:128px; height:128px; image-rendering:pixelated; }
    .qr-title { font-size:13px; font-weight:600; margin-top:12px; }
    .qr-scope { font-size:11px; color:var(--muted); margin-top:12px; }
    .qr-scope strong { color:var(--accent); font-weight:500; }
    .stopped .qr-box { opacity:.23; }
    .addresses { margin:0 15px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .network-group + .network-group { border-top:1px solid var(--line); }
    .group-head { padding:12px 12px 8px; display:flex; align-items:center; gap:8px; }
    .group-symbol { color:var(--muted); display:flex; }
    .group-symbol .icon { width:16px; height:16px; }
    .group-title { font-size:12px; font-weight:650; flex:1; }
    .group-hint { font-size:10px; color:var(--muted); padding:0 12px 9px 36px; line-height:1.45; }
    .network-group.inline .group-head { padding-bottom:12px; }
    .network-group.inline .group-title { flex:0 0 auto; }
    .group-inline-hint { flex:1; min-width:0; font-size:10px; color:var(--muted); }
    .state-label { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
    .dot { width:5px; height:5px; border-radius:50%; background:var(--ok); }
    .dot.warn { background:var(--warn); } .dot.error { background:var(--danger); }
    .network-group.off .group-head { padding-bottom:12px; }
    .network-group.off .group-hint { margin-top:-4px; }
    .switch { border:0; padding:0; width:36px; height:21px; background:var(--strong); border-radius:999px; position:relative; flex-shrink:0; }
    .switch::after { content:""; width:17px; height:17px; background:#fff; position:absolute; left:2px; top:2px; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.13); transition:transform .16s; }
    .switch.on { background:var(--accent); } .switch.on::after { transform:translateX(15px); }
    .action-toggle { padding:4px 10px; background:transparent; border:1px solid var(--line); border-radius:7px; color:var(--muted); font-size:10px; min-width:46px; }
    .action-toggle:hover { border-color:var(--accent); color:var(--accent); }
    .menu-wrap { position:relative; }
    .status-toggle { display:flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--surface-alt); padding:5px 7px; border-radius:7px; font-size:10px; }
    .status-toggle .icon { width:10px; height:10px; }
    .menu { position:absolute; right:0; top:31px; width:116px; z-index:5; border-radius:9px; border:1px solid var(--line); background:var(--surface); padding:4px; box-shadow:0 8px 24px rgba(40,30,15,.16); }
    .menu button { border:0; background:none; width:100%; text-align:left; padding:8px; border-radius:5px; font-size:11px; }
    .menu button:hover { background:var(--surface-alt); }
    .address-row { margin:0 7px; padding:8px 7px; border-top:1px solid var(--line); border-radius:0; }
    .address-row.selected { background:var(--accent-soft); border-radius:7px; border-top-color:transparent; }
    .address-row + .address-row { margin-top:3px; }
    .address-row:last-child { margin-bottom:7px; }
    .row-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
    .row-label { font-size:10px; color:var(--muted); flex:1; }
    .selected .row-label { color:var(--accent); }
    .row-tools { display:flex; align-items:center; gap:4px; }
    .row-select { width:100%; border:0; background:none; text-align:left; padding:0; cursor:pointer; }
    .row-select .row-label { display:flex; align-items:center; gap:5px; min-height:21px; margin-bottom:5px; padding-right:81px; }
    .row-tools { position:absolute; right:7px; top:8px; }
    .address-row { position:relative; }
    .copy { width:23px; height:21px; border:0; background:none; color:var(--muted); display:grid; place-items:center; border-radius:4px; }
    .copy .icon { width:14px; height:14px; }
    .copy:hover { color:var(--accent); background:var(--accent-soft); }
    .address-value { width:100%; text-align:left; display:block; font:11px var(--mono); color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:0; padding:0; background:none; line-height:1.6; }
    .address-value:hover { color:var(--accent); }
    .group-foot { margin:1px 12px 11px; font-size:10px; color:var(--muted); display:flex; gap:8px; align-items:center; justify-content:space-between; }
    .text-action { color:var(--accent); border:0; padding:0; font-size:10px; background:none; }
    .failure { color:var(--danger); }
    .ticket-footer { display:flex; align-items:center; justify-content:center; gap:6px; color:var(--muted); font:10px var(--mono); padding:16px 8px; }
    .ticket-footer .icon { width:13px; height:13px; }
    .app-actions { display:flex; gap:10px; padding:12px 20px 17px; background:var(--bg); flex-shrink:0; }
    .ghost,.danger { display:flex; align-items:center; justify-content:center; gap:7px; border-radius:11px; height:39px; font-size:13px; font-weight:600; }
    .ghost { flex:1; border:1px solid var(--line); background:var(--surface); }
    .danger { border:0; background:var(--danger); color:white; padding:0 19px; box-shadow:0 1px 2px rgba(0,0,0,.18); }
    .danger.restart { background:var(--accent); }
    .toast { position:fixed; left:50%; bottom:25px; transform:translateX(-50%); padding:10px 16px; background:var(--ink); color:var(--surface); border-radius:9px; font-size:12px; z-index:30; box-shadow:0 4px 15px rgba(0,0,0,.15); }
    [hidden] { display:none !important; }
    dialog { width:350px; max-width:calc(100vw - 36px); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:15px; padding:22px; box-shadow:0 18px 60px rgba(40,30,15,.2); }
    dialog::backdrop { background:rgba(35,29,20,.28); }
    dialog h2 { font:600 20px var(--serif); margin:0 0 12px; }
    dialog p { color:var(--muted); line-height:1.7; font-size:12px; }
    dialog .full-url { font:12px/1.8 var(--mono); overflow-wrap:anywhere; color:var(--ink); padding:12px; background:var(--field); border-radius:8px; user-select:all; }
    dialog .ghost { width:100%; margin-top:16px; }
    @media(max-width:820px) { .workspace { gap:28px; padding:22px 18px; } .inspector { width:220px; padding-top:16px; } .window { height:calc(100dvh - 44px); } }
    @media(max-width:660px) {
      .workspace { display:flex; flex-direction:column; align-items:center; padding:20px 12px; gap:20px; }
      .inspector { width:460px; max-width:100%; padding:0 8px; }
      .intro { margin-bottom:12px; } .control-block { padding:12px 0; }
      .scenario-block,.explanation { display:none; }
      .window { height:850px; min-height:0; } .app-header,.app-actions { padding-left:14px; padding-right:14px; }
      .app-scroll { padding-left:12px; padding-right:12px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::after { transition:none !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <symbol id="i-back" viewBox="0 0 18 18"><path d="m11 3-6 6 6 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 18 18"><path d="M2 5V3.5h5l2 2h7v9H2Z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 18 18"><path d="M2 7V2h5M11 16h5v-5M2 2l5 5m9 9-5-5"/></symbol>
    <symbol id="i-open" viewBox="0 0 18 18"><path d="M6 3h9v9M15 3 3 15"/></symbol>
    <symbol id="i-copy" viewBox="0 0 18 18"><rect x="6" y="5" width="9" height="11" rx="1.5"/><path d="M11 5V2H3v11h3"/></symbol>
    <symbol id="i-qr" viewBox="0 0 18 18"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/><path d="M5 5h2v2H5ZM11 5h2v2h-2ZM5 11h2v2H5ZM11 11h2v2h-2Z"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 18 18"><path d="M2 6a11 11 0 0 1 14 0M5 9a6 6 0 0 1 8 0M7.5 12a2.3 2.3 0 0 1 3 0"/><circle cx="9" cy="15" r=".6"/></symbol>
    <symbol id="i-network" viewBox="0 0 18 18"><circle cx="4" cy="5" r="2"/><circle cx="14" cy="5" r="2"/><circle cx="9" cy="14" r="2"/><path d="m5 7 3 5m5-5-3 5M6 5h6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7"/><ellipse cx="9" cy="9" rx="3" ry="7"/><path d="M2 9h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 18 18"><path d="m5 7 4 4 4-4"/></symbol>
    <symbol id="i-swap" viewBox="0 0 18 18"><path d="M3 5h12m-3-3 3 3-3 3M15 13H3m3-3-3 3 3 3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7"/><path d="M9 5v4l3 2"/></symbol>
    <symbol id="i-stop" viewBox="0 0 18 18"><rect x="4" y="4" width="10" height="10" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-play" viewBox="0 0 18 18"><path d="m6 3 9 6-9 6Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 18 18"><path d="m3 9 4 4 8-8"/></symbol>
    <symbol id="i-warning" viewBox="0 0 18 18"><path d="M9 2 17 16H1Z"/><path d="M9 7v4m0 2v.2"/></symbol>
    <symbol id="i-verified" viewBox="0 0 18 18"><path d="m9 1 2 2 3 .3.7 3L17 9l-2.3 2.7-.7 3-3 .3-2 2-2-2-3-.3-.7-3L1 9l2.3-2.7.7-3 3-.3Z"/><path d="m5.5 9 2.3 2.3 4.7-4.6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 18 18"><path d="M7 2h4l.5 2 1.5 1 2-.5 2 3-1.5 1.5v2L17 12l-2 3-2-.5-1.5 1-.5 2H7l-.5-2-1.5-1-2 .5-2-3L2.5 10V8L1 6.5l2-3L5 4l1.5-1Z" transform="translate(0 -1) scale(.94)"/><circle cx="9" cy="9" r="2.5"/></symbol>
  </defs></svg>

  <main class="workspace">
    <aside class="inspector" aria-label="Demo 控制台">
      <div class="wordmark">LocalShare</div>
      <div class="eyebrow">分享地址 · 交互原型</div>
      <p class="intro">一个二维码，一张地址列表。<br>按访问范围分组，开关就在旁边。</p>
      <section class="control-block">
        <label class="control-title">比较控制方式</label>
        <div class="segmented" aria-label="控制方式">
          <button class="active" data-control="switch" aria-pressed="true">开关</button>
          <button data-control="button" aria-pressed="false">文字按钮</button>
          <button data-control="menu" aria-pressed="false">状态菜单</button>
        </div>
        <p class="note" id="control-note">开关表示是否开放；连接状态单独显示。</p>
      </section>
      <section class="control-block scenario-block">
        <label class="control-title">模拟场景</label>
        <label class="demo-field">Tailscale<select id="tailscale-scenario"><option value="ready">已检测到</option><option value="missing">未检测到</option></select></label>
        <label class="demo-field">公网连接<select id="internet-scenario"><option value="success">正常</option><option value="failure">连接失败</option></select></label>
        <label class="demo-field">外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <button class="reset" id="reset"><svg class="icon"><use href="#i-swap"/></svg>恢复初始状态</button>
      </section>
      <section class="control-block explanation">
        <label class="control-title">可以试试</label>
        <p class="note">点击<strong>整条地址</strong>，切换扫码入口。<br>开启互联网，观察连接状态。<br>关闭正在扫码的网络，二维码回到局域网。</p>
        <p class="note">示例地址和连接状态仅用于演示。二维码对应示例网址。</p>
      </section>
    </aside>

    <section class="window" aria-label="LocalShare 分享文件预览">
      <div class="chrome"><span class="traffic"></span><span class="traffic"></span><span class="traffic"></span><span class="chrome-label">LocalShare</span></div>
      <header class="app-header">
        <button class="icon-button" id="back" aria-label="返回"><svg class="icon"><use href="#i-back"/></svg></button>
        <h1>分享文件</h1>
        <button class="icon-button" id="settings" aria-label="连接设置"><svg class="icon"><use href="#i-settings"/></svg></button>
      </header>
      <div class="app-scroll">
        <article class="ticket" id="ticket">
          <div class="file-meta">
            <div class="folder-glyph"><svg class="icon"><use href="#i-folder"/></svg></div>
            <div><div class="file-name" id="file-name">秋日旅行</div><div class="file-detail" id="file-detail">12 个项目 · 128 MB</div><div class="permissions"><span class="chip">只读</span><span class="chip">可下载</span></div></div>
          </div>
          <div class="tear"></div>
          <div class="segmented access-mode" id="access-mode" aria-label="访问方式"><button id="mode-link" data-access-mode="link" class="active" aria-pressed="true">分享链接</button><button id="mode-code" data-access-mode="code" aria-pressed="false">访问码</button></div>
          <div class="access-mode-detail" id="access-mode-detail"><div id="access-code" class="access-code" hidden>访问码 · DEM-123</div><div id="share-link-hint">扫码或打开分享链接</div></div>
          <div class="qr-area">
            <div class="qr-box"><img id="qr-image" alt="局域网 IP 地址的二维码"></div>
            <div class="qr-title" id="qr-title" hidden></div>
            <div class="qr-scope" id="qr-scope"><strong>局域网</strong> · 同一网络</div>
          </div>
          <div class="addresses" id="addresses"></div>
          <div class="ticket-footer"><svg class="icon"><use href="#i-clock"/></svg><span id="deadline">将于 2026/10/14 23:00 自动关闭分享</span></div>
        </article>
      </div>
      <footer class="app-actions">
        <button class="ghost" id="replace"><svg class="icon"><use href="#i-swap"/></svg>更换</button>
        <button class="danger" id="stop"><svg class="icon"><use href="#i-stop"/></svg><span>停止</span></button>

    function row(address) {
      const selected = state.selected === address.id;
      const value = state.accessCode && address.group !== 'internet' ? new URL(address.url).origin : address.url;
      return `<div class="address-row ${selected ? 'selected' : ''}">
        <button class="row-select" data-select="${address.id}" aria-pressed="${selected}" aria-label="${groups[address.group].title}${address.label}：${address.url}">
          <span class="row-label">${address.group === 'internet' ? `<span class="relay-title">${address.label}</span><span class="relay-divider">|</span><span class="relay-domain" title="${new URL(address.url).hostname}">${new URL(address.url).hostname}</span>${new URL(address.url).hostname === 'share.fairydog.net' ? `<span class="relay-verified" role="img" aria-label="默认服务" title="默认服务">${icon('verified')}</span>` : ''}` : address.label}</span>
          <span class="address-value" title="${value}">${value}</span>
        </button>
        <div class="row-tools">
          <button class="copy" data-details="${address.id}" aria-label="显示完整${address.label}" title="显示完整地址">${icon('expand')}</button>
          <button class="copy" data-copy="${address.id}" aria-label="复制${groups[address.group].title}${address.label}" title="复制链接">${icon('copy')}</button>
          <a class="copy" href="${value}" target="_blank" rel="noopener noreferrer" aria-label="在浏览器打开${address.label}" title="在浏览器打开">${icon('open')}</a>
        </div>
      </div>`;
    }
    function render() {
      if (!isAvailable(addresses.find(a => a.id === state.selected).group)) state.selected = 'lan-ip';
      $('addresses').innerHTML = Object.entries(groups)
        .filter(([key]) => key !== 'tailscale' || state.detected)
        .map(([key, group]) => {
        const on = key === 'lan' ? state.running : state[key];
        const available = isAvailable(key);
        const statusText = {connecting:'连接中',online:'在线',failed:'连接失败'}[state.remote];
        const status = key === 'internet' && on && state.running
          ? `<span class="state-label" role="img" aria-label="${statusText}" title="${statusText}"><i class="dot ${state.remote === 'connecting' ? 'warn' : state.remote === 'failed' ? 'error' : ''}"></i></span>`
          : key === 'lan' ? `<span class="state-label">${state.running ? '可用' : '已停止'}</span>` : '';
        let hint = available ? group.hint : '';
        let foot = '';
        if (key === 'internet' && on && state.running) {
          if (state.remote === 'failed') foot = `<div class="group-foot failure"><span>暂时无法连接中继服务</span><button class="text-action" data-retry>重试</button></div>`;
          else if (state.remote === 'online') foot = `<div class="group-foot"><span class="relay-warning">${icon('warning')}<span>中继服务可读取分享内容，请使用可信任的中继</span></span><button class="text-action" data-guide>使用说明</button></div>`;
        }
        const inline = key === 'internet';
        return `<section class="network-group ${available ? '' : 'off'} ${inline ? 'inline' : ''}" aria-label="${group.title}地址">
          <div class="group-head"><span class="group-symbol">${icon(group.icon)}</span><span class="group-title">${group.title}</span>${inline ? `<span class="group-inline-hint">${group.hint}</span>` : ''}${status}${key === 'lan' ? '' : toggleControl(key,on)}</div>
          ${hint && !inline ? `<div class="group-hint">${hint}</div>` : ''}
          ${available ? addresses.filter(a => a.group === key && (a.id !== 'lan-name' || state.hostnameExpanded)).map(row).join('') : ''}${key === 'lan' && available ? `<button class="hostname-toggle" data-hostname aria-label="本机名称" aria-expanded="${state.hostnameExpanded}">${state.hostnameExpanded ? '' : '<span class="hostname-preview" aria-hidden="true">本机名称</span>'}${icon('chevron')}</button>` : ''}${foot}
        </section>`;
      }).join('');
      const selected = addresses.find(a => a.id === state.selected);
      $('qr-image').src = qrImages[selected.id];
      $('qr-image').alt = `${groups[selected.group].title}${selected.label}的二维码`;
      $('qr-title').textContent = state.running ? '' : '分享已停止';
      $('qr-title').hidden = state.running;
      $('qr-scope').innerHTML = state.running ? `<strong>${groups[selected.group].title}</strong> · ${groups[selected.group].hint}` : '重新分享后可访问';
      $('ticket').classList.toggle('stopped',!state.running);
      $('deadline').textContent = state.running ? '将于 2026/10/14 23:00 自动关闭分享' : '所有访问入口已关闭';
      $('access-mode').hidden = !state.running;
      for (const [id, selected] of [['mode-link', !state.accessCode], ['mode-code', state.accessCode]]) {
        $(id).classList.toggle('active', selected); $(id).setAttribute('aria-pressed', String(selected));
      }
      $('access-mode-detail').hidden = !state.running;
      $('access-code').hidden = !state.accessCode;
      $('share-link-hint').hidden = state.accessCode;
      $('stop').classList.toggle('restart',!state.running);
      $('stop').innerHTML = icon(state.running ? 'stop' : 'play') + `<span>${state.running ? '停止' : '重新分享'}</span>`;
    }
    function toast(text) {
      clearTimeout(toastTimer); $('toast').textContent = text; $('toast').hidden = false;
      toastTimer = setTimeout(() => $('toast').hidden = true,2000);
    }
    function connect() {
      const current = ++generation;
      state.remote = 'connecting'; render();
      setTimeout(() => {
        if (current !== generation || !state.internet || !state.running) return;
        state.remote = state.fail ? 'failed' : 'online'; render();
      },1100);
    }
    function toggle(group) {
      if (!state.running || (group === 'tailscale' && !state.detected)) return;
      state[group] = !state[group];
      if (group === 'internet') {
        if (state.internet) connect();
        else { generation++; state.remote = 'off'; render(); }
      } else render();
    }
    function showDialog(title,content) {
      $('dialog-title').textContent = title; $('dialog-content').innerHTML = content; $('details').showModal();
    }
    $('addresses').addEventListener('click',async event => {
      const button = event.target.closest('button'); if (!button) return;
      if (button.hasAttribute('data-toggle')) toggle(button.dataset.toggle);
      else if (button.hasAttribute('data-hostname')) { state.hostnameExpanded = !state.hostnameExpanded; render(); }
      else if (button.hasAttribute('data-menu')) {
        const panel = button.nextElementSibling; const open = panel.hidden;
        document.querySelectorAll('[data-menu-panel]').forEach(p => p.hidden = true);
        document.querySelectorAll('[data-menu]').forEach(b => b.setAttribute('aria-expanded','false'));
        panel.hidden = !open; button.setAttribute('aria-expanded',String(open));
      } else if (button.hasAttribute('data-select')) { state.selected = button.dataset.select; render(); }
      else if (button.hasAttribute('data-copy')) {
        const address = addresses.find(a => a.id === button.dataset.copy);
        try { await navigator.clipboard.writeText(state.accessCode && address.group !== 'internet' ? new URL(address.url).origin : address.url); toast('链接已复制'); }
        catch { showDialog('复制链接',`<p>选择下方网址即可手动复制。</p><div class="full-url">${address.url}</div>`); }
      } else if (button.hasAttribute('data-details')) {
        const address = addresses.find(a => a.id === button.dataset.details);
        showDialog(`${groups[address.group].title} · ${address.label}`,`<div class="full-url">${address.url}</div><p>${groups[address.group].hint}</p>`);
      } else if (button.hasAttribute('data-retry')) connect();
      else if (button.hasAttribute('data-guide')) showDialog('互联网分享', '<p>连接后，把互联网分享链接发给对方。对方可以用浏览器访问，无需同一网络。</p><p>分享期间 Mac 需保持在线。关闭互联网访问后，局域网和 Tailscale 仍可继续使用。</p>');
    });
    document.addEventListener('click',event => {
      if (event.target.closest('.menu-wrap')) return;
      document.querySelectorAll('[data-menu-panel]').forEach(p => p.hidden = true);
      document.querySelectorAll('[data-menu]').forEach(b => b.setAttribute('aria-expanded','false'));
    });
    document.addEventListener('keydown',event => {
      if (event.key === 'Escape') {
        document.querySelectorAll('[data-menu-panel]').forEach(p => p.hidden = true);
        document.querySelectorAll('[data-menu]').forEach(b => b.setAttribute('aria-expanded','false'));
      }
    });
    document.querySelectorAll('[data-control]').forEach(button => button.addEventListener('click',() => {
      state.control = button.dataset.control;
      document.querySelectorAll('[data-control]').forEach(b => { b.classList.toggle('active',b === button); b.setAttribute('aria-pressed',String(b === button)); });
      $('control-note').textContent = {switch:'开关表示是否开放；连接状态单独显示。',button:'用明确动作控制访问，点击后变为相反动作。',menu:'把状态和操作合并，开启或关闭需要两次点击。'}[state.control];
      render();
    }));
    $('tailscale-scenario').addEventListener('change',event => { state.detected = event.target.value === 'ready'; render(); });
    $('internet-scenario').addEventListener('change',event => { state.fail = event.target.value === 'failure'; if (state.internet && state.running) connect(); });
    $('theme').addEventListener('change',event => document.documentElement.dataset.theme = event.target.value);
    $('access-mode').addEventListener('click',event => {
      const button = event.target.closest('[data-access-mode]'); if (!button) return;
      state.accessCode = button.dataset.accessMode === 'code'; render();
    });
    $('stop').addEventListener('click',() => {
      state.running = !state.running; generation++;
      if (!state.running) { state.internet = false; state.remote = 'off'; }
      render();
    });
    $('replace').addEventListener('click',() => {
      state.file = 1 - state.file;
      $('file-name').textContent = state.file ? '项目资料' : '秋日旅行';
      $('file-detail').textContent = state.file ? '8 个项目 · 64 MB' : '12 个项目 · 128 MB';
      toast('已更换示例文件夹');
    });
    $('settings').addEventListener('click',() => showDialog('连接设置', '<p>默认服务</p><div class="full-url">https://share.example.com</div><p>服务地址和配对配置在这里管理。分享页只显示可以发给对方的链接。</p>'));
    $('back').addEventListener('click',() => toast('当前展示分享文件页'));
    $('dialog-close').addEventListener('click',() => $('details').close());
    $('details').addEventListener('click',event => { if (event.target === $('details')) { const r = $('details').getBoundingClientRect(); if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) $('details').close(); } });
    $('reset').addEventListener('click',() => {
      generation++; Object.assign(state,{selected:'lan-ip',tailscale:true,internet:false,remote:'off',running:true,accessCode:false,hostnameExpanded:false,detected:true,fail:false,file:0});
      $('tailscale-scenario').value = 'ready'; $('internet-scenario').value = 'success';
      $('file-name').textContent = '秋日旅行'; $('file-detail').textContent = '12 个项目 · 128 MB'; render(); toast('已恢复初始状态');
    });
    render();
  </script>
</body>
</html>
