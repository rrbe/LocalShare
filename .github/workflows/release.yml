name: Release

# 推送 vX.Y.Z 标签即触发：编译 universal → 校验依赖（仅许内置 framework）→ 打 DMG →
# 建 GitHub Release → EdDSA 签名 + 生成 appcast.xml 作为 Release 资产上传（供 Sparkle 自动更新，
# feed 走 releases/latest/download 固定地址，发布对仓库零写入）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release、上传资产需要写权限

jobs:
  release:
    runs-on: macos-latest # Apple Silicon runner，自带 Xcode / Swift 工具链
    steps:
      - uses: actions/checkout@v4 # 浅克隆即可：changelog 要的 tag 注释由组装正文步骤单独 fetch

      - name: 解析版本号（去掉前缀 v）
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 写入版本号到 Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" bundle/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" bundle/Info.plist

      - name: 编译并组装 .app（universal + 内置 Sparkle + ad-hoc 签名）
        run: bash build.sh

      - name: 校验依赖（仅允许内置 @rpath framework，禁止包外 dylib）
        run: |
          # 放宽后的核心戒律：dufs 死于运行时缺失的包外 dylib（/opt/homebrew）。这里逐条核对——
          # 系统库放行；@rpath 引用必须对应包内 Contents/Frameworks 里存在的 framework；
          # 其余绝对路径包外 dylib 一律失败。build.sh 已做同样检查，这里在 CI 再设一道可见闸门。
          BIN=dist/LocalShare.app/Contents/MacOS/LocalShare
          FAIL=0
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            case "$dep" in
              /usr/lib/*|/System/Library/*) ;;
              @rpath/*)
                fw="${dep#@rpath/}"; fw="${fw%%/*}"
                if [ -e "dist/LocalShare.app/Contents/Frameworks/$fw" ]; then
                  echo "ok 内置依赖: $dep"
                else
                  echo "::error::@rpath 依赖未随包: $dep（缺 Contents/Frameworks/$fw）"; FAIL=1
                fi ;;
              *) echo "::error::检测到包外 dylib 依赖: $dep"; FAIL=1 ;;
            esac
          done < <(otool -L "$BIN" | grep '^[[:space:]]' | awk '{print $1}' | sort -u)
          [ "$FAIL" -eq 0 ] || { echo "依赖校验失败，违反核心戒律"; exit 1; }

      - name: 打包 DMG（含 Applications 软链，方便拖入）
        run: |
          STAGE="$(mktemp -d)"
          cp -R dist/LocalShare.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname LocalShare -srcfolder "$STAGE" -ov -format UDZO "LocalShare-$VERSION.dmg"

      - name: 组装 Release 正文（changelog 取自 tag 注释）
        run: |
          # changelog 写在 annotated tag 的注释里（git tag -a vX.Y.Z -F notes.md），这里取出
          # 拼进「更新内容」一节；轻量 tag 无注释则退化为纯安装说明。注释只写 - 列表、不写 #
          # 标题行（git tag 默认 cleanup=strip 会把 # 行当注释剥掉，标题统一由这里加）。
          # 注意 actions/checkout 会把触发构建的 tag 重建成指向提交的轻量 tag（actions/checkout#290），
          # 直接读 %(contents) 拿到的是提交信息——先按远端原样恢复 tag 对象，并确认确为 annotated tag。
          git fetch origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" --force
          CHANGELOG=""
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
            CHANGELOG="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          fi
          printf '**LocalShare %s** · 局域网文件 / 文件夹只读分享，扫码即看。\nUniversal（Apple Silicon + Intel），要求 macOS 13+。\n' "$VERSION" > release_body.md
          if [ -n "$CHANGELOG" ]; then
            printf '\n## 更新内容\n\n%s\n' "$CHANGELOG" >> release_body.md
          fi
          cat >> release_body.md <<'BODY'

          ## ⚠️ 首次打开被「隐私与安全性」拦截怎么办
          本包是 ad-hoc 签名、未经 Apple 公证，从网络下载会被 Gatekeeper 拦（提示「已损坏」或「无法打开」）。任选一种解除：

          **方式 A**：「系统设置 → 隐私与安全性」，下滑找到被拦提示，点「仍要打开」。

          **方式 B（终端一行）**：
          ```bash
          xattr -dr com.apple.quarantine /Applications/LocalShare.app
          ```
          BODY

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: LocalShare ${{ env.VERSION }}
          files: LocalShare-${{ env.VERSION }}.dmg
          body_path: release_body.md

      - name: EdDSA 签名 DMG + 生成 appcast.xml 挂到 Release
        env:
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 未配置私钥则跳过（首次发布、或暂未启用自动更新时）。DMG 已发布，仅缺自动更新喂源。
          if [ -z "$ED_KEY" ]; then
            echo "::warning::未配置 secret SPARKLE_ED_PRIVATE_KEY，跳过 appcast 生成（本次发布不提供自动更新）"
            exit 0
          fi

          # sign_update 工具随 Sparkle 的 SPM artifact 一并下载，版本与 app 内 framework 严格一致。
          SIGN_UPDATE="$(find .build/artifacts -name sign_update -path '*bin*' 2>/dev/null | head -1)"
          [ -x "$SIGN_UPDATE" ] || { echo "::error::未找到 sign_update 工具"; exit 1; }

          # 用私钥对 DMG 做 EdDSA 签名；不带 -p 时直接输出 enclosure 需要的整串属性：
          #   sparkle:edSignature="..." length="12345"
          # 私钥来自 secret（即 generate_keys -x 导出的文件内容），经 --ed-key-file 传入。
          printf '%s' "$ED_KEY" > /tmp/sparkle_ed_key
          SIG_ATTRS="$("$SIGN_UPDATE" --ed-key-file /tmp/sparkle_ed_key "LocalShare-$VERSION.dmg")"
          rm -f /tmp/sparkle_ed_key
          echo "签名结果: $SIG_ATTRS"

          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/LocalShare-$VERSION.dmg"
          PUBDATE="$(date "+%a, %d %b %Y %H:%M:%S %z")"

          # appcast 不进 git：写完直接作为资产挂到本次 Release 上（覆盖 checkout 里的同名旧文件，
          # 仅作上传用、不提交）。SUFeedURL 用 releases/latest/download 固定地址即恒指向最新版；
          # appcast 只保留最新一项即可触发更新比对。
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>LocalShare</title>
              <item>
                <title>$VERSION</title>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <pubDate>$PUBDATE</pubDate>
                <enclosure url="$DMG_URL" $SIG_ATTRS type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          # --clobber：重跑 job 时覆盖已存在的同名资产。
          gh release upload "$GITHUB_REF_NAME" appcast.xml --clobber
